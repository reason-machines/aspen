# Dependabot keeps the GitHub Actions pins current. Every workflow names
# actions by full commit SHA with the version as a comment (issue #122,
# enforced by `cargo xtask check-workflows`); Dependabot bumps both together.
# The tools in .github/scripts/install-tool.sh are pinned by SHA-256 and are
# bumped by hand, as that script describes.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
