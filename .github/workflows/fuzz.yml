# D3: fuzzing (docs/PLAN.md section 4, item 5; fuzz/README.md).
#
# Every target runs under libFuzzer with AddressSanitizer for a few minutes
# each night, on a working corpus that the Actions cache keeps between runs.
# A failing input fails the run and is uploaded as the `fuzz-artifacts`
# artifact. Reproduce it on stable with
# `cargo run -p aspen-fuzz -- run <target> <file>`, fix the bug, and commit
# the input to fuzz/regressions/<target>/ so required CI replays it.
#
# Required CI only replays the committed corpus (`cargo test -p aspen-fuzz`,
# under a second). This job is GitHub-hosted and the organization's
# hosted-runner minutes are limited, so the nightly run is small: 180 s per
# target, about 45 runner-minutes for the 13 targets. A manual run may take
# up to 600 s per target and 4,800 s in all, which ends inside the job's
# timeout. Longer campaigns (the launch gate's 24 hours or more; about 35
# with 13 targets) run with fuzz/run.sh on a machine of your own.
name: Fuzz

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target (at most 600, and 4800 for all targets together)
        default: "180"
      targets:
        description: Targets, space-separated (empty runs all)
        default: ""

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The nightly fuzz/run.sh defaults to, and the cargo-fuzz release, pinned
  # so a run does not change under us.
  FUZZ_TOOLCHAIN: nightly-2026-11-02
  CARGO_FUZZ_VERSION: 0.13.2

jobs:
  fuzz:
    name: fuzz (every target)
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz/libfuzzer
          # The automatic key holds the default (stable) toolchain's
          # version, not the nightly this job builds with.
          key: ${{ env.FUZZ_TOOLCHAIN }}
      - name: Install cargo-fuzz
        run: |
          if ! cargo fuzz --version 2>/dev/null | grep -qx "cargo-fuzz $CARGO_FUZZ_VERSION"; then
            cargo install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked --force
          fi
      - name: Restore the working corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '180' }}
          FUZZ_TARGETS: ${{ inputs.targets }}
        # FUZZ_TARGETS is split into words on purpose: one argument per target.
        run: |
          case "$FUZZ_SECONDS" in
            '' | *[!0-9]*) echo "::error::seconds must be a whole number" >&2; exit 1 ;;
          esac
          if [ "$FUZZ_SECONDS" -gt 600 ]; then
            echo "::error::seconds is at most 600 here; run fuzz/run.sh elsewhere for longer" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          set -- $FUZZ_TARGETS
          count=$#
          if [ "$count" -eq 0 ]; then
            wrappers=(fuzz/libfuzzer/fuzz_targets/*.rs)
            count=${#wrappers[@]}
          fi
          if [ $((FUZZ_SECONDS * count)) -gt 4800 ]; then
            echo "::error::$count targets × $FUZZ_SECONDS s is over 4800 s; pick fewer targets or fewer seconds" >&2
            exit 1
          fi
          fuzz/run.sh -t "$FUZZ_SECONDS" -j "$(nproc)" -w "$RUNNER_TEMP/fuzz" "$@"
      - name: Save the working corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: ${{ runner.temp }}/fuzz/artifacts
          retention-days: 14
