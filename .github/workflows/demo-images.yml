# Builds the Aspen and place images from one commit and pushes them to the
# public demo's ECR repositories (deploy/terraform/aws/public-demo, step 4 of
# its README). It signs in with GitHub's OIDC token and the account stack's
# aspen-image-publisher role, so no AWS key is stored anywhere. The role
# trusts only this repository's main branch (github_image_refs), so run it
# from main.
#
# The job summary prints the aspen_image and place_image lines for the
# environment's .tfvars: the commit tag plus the pushed digest.
name: Demo images

on:
  workflow_dispatch:
    inputs:
      aws_account_id:
        description: "The demo's dedicated AWS account ID"
        required: true
        type: string
      region:
        description: "Region of the ECR repositories"
        required: false
        default: us-east-1
        type: string

concurrency:
  group: demo-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: build and push to ECR
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    env:
      ACCOUNT: ${{ inputs.aws_account_id }}
      AWS_REGION: ${{ inputs.region }}
    steps:
      - name: check the inputs
        run: |
          [[ "$ACCOUNT" =~ ^[0-9]{12}$ ]] || { echo "aws_account_id must be 12 digits" >&2; exit 1; }
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]$ ]] || { echo "region looks wrong: $AWS_REGION" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: sign in to AWS with the workflow's OIDC token
        run: |
          token_file="$RUNNER_TEMP/aws-web-identity-token"
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value > "$token_file"
          chmod 600 "$token_file"
          {
            echo "AWS_WEB_IDENTITY_TOKEN_FILE=$token_file"
            echo "AWS_ROLE_ARN=arn:aws:iam::$ACCOUNT:role/aspen-image-publisher"
            echo "AWS_ROLE_SESSION_NAME=demo-images-$GITHUB_RUN_ID"
          } >> "$GITHUB_ENV"
      - name: log in to ECR
        run: |
          [ "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT" ]
          registry="$ACCOUNT.dkr.ecr.$AWS_REGION.amazonaws.com"
          password="$(aws ecr get-login-password)"
          echo "::add-mask::$password"
          printf '%s' "$password" | docker login --username AWS --password-stdin "$registry"
          echo "REGISTRY=$registry" >> "$GITHUB_ENV"
          echo "TAG=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build and push aspen
        id: aspen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/aspen:${{ env.TAG }}
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: build and push aspen-place
        id: place
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: place
          platforms: linux/amd64
          tags: ${{ env.REGISTRY }}/aspen-place:${{ env.TAG }}
          push: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: the images' tfvars lines
        env:
          ASPEN_DIGEST: ${{ steps.aspen.outputs.digest }}
          PLACE_DIGEST: ${{ steps.place.outputs.digest }}
        run: |
          {
            echo '```hcl'
            echo "aspen_image = \"$REGISTRY/aspen:$TAG@$ASPEN_DIGEST\""
            echo "place_image = \"$REGISTRY/aspen-place:$TAG@$PLACE_DIGEST\""
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
