# The libFuzzer harness for aspen-fuzz's targets: one thin binary per
# target. It is its own workspace (excluded from the root one) because it
# needs a nightly toolchain and libfuzzer-sys; required CI never builds it.
# Run it with cargo-fuzz from the repository root, for example:
#
#   cargo +nightly fuzz run --fuzz-dir fuzz/libfuzzer pkt_line
#
# fuzz/README.md has the full instructions; fuzz/run.sh runs every target.

[package]
name = "aspen-fuzz-libfuzzer"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
aspen-fuzz = { path = ".." }
libfuzzer-sys = "=0.4.13"

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "pkt_line"
path = "fuzz_targets/pkt_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "receive_request"
path = "fuzz_targets/receive_request.rs"
test = false
doc = false
bench = false

