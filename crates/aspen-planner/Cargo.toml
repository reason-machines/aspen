[package]
name = "aspen-planner"
description = "Pure fetch planning for Aspen: picks the stored packs a fetch sends. No I/O; depends only on aspen-core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aspen-core = { path = "../aspen-core" }

[dev-dependencies]
# The property tests build real repositories and check plans against
# `git rev-list --objects`; testkit provides isolated `git` commands and the
# pinned SplitMix64 generator, so a printed seed replays on any machine.
aspen-testkit = { path = "../../testkit" }
tempfile.workspace = true

[lints]
workspace = true
