[package]
name = "aspen-blob"
description = "Aspen's blob store backends: a local directory and S3-compatible object storage."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aspen-core = { path = "../aspen-core" }
bytes = "1"
hmac = "0.13"
# S3 only for now; GCS and Azure plug into `ObjectBlobStore` the same way.
# `ring` instead of the default `aws-lc-rs` keeps the build free of C/CMake
# and of aws-lc's OpenSSL licence term.
object_store = { version = "0.14.2", default-features = false, features = ["aws-base", "reqwest", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
url = "2"

[dev-dependencies]
# For the fault-injecting `ObjectStore` wrapper in tests/object_faults.rs.
async-trait = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
