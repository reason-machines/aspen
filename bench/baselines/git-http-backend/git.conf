# Smart HTTP for every repository under /srv/git (git-http-backend(1)).
ServerName localhost
SetEnv GIT_PROJECT_ROOT /srv/git
SetEnv GIT_HTTP_EXPORT_ALL
# Pass the protocol v2 request header through to the backend.
SetEnvIf Git-Protocol ".*" GIT_PROTOCOL=$0
ScriptAlias / /usr/lib/git-core/git-http-backend/

<Directory "/usr/lib/git-core">
    Options +ExecCGI
    Require all granted
</Directory>

# Raise Apache's default of 150 concurrent requests so the baseline is limited
# by Git, not by a connection cap (up to 1,024 concurrent requests).
<IfModule mpm_event_module>
    ServerLimit              32
    ThreadsPerChild          32
    MaxRequestWorkers      1024
    ListenBacklog          4096
</IfModule>

# Request logs would dominate disk I/O under load.
CustomLog /dev/null common
ErrorLog /proc/self/fd/2
LogLevel warn
